<h1 style="font-size:20px">트리플에스, 24인 완전체로 16일 &#x27;Andless&#x27; 컴백</h1>
<p>모드하우스는 10월 11일 그룹 트리플에스(tripleS)가 멤버 24명 완전체로 컴백한다고 밝혔다.</p><p>새 싱글은 &#x27;&lt;LOVE&amp;POP&gt; pt.2 &#x27;Andless&#x27;&#x27;로, 10월 16일 오후 1시(한국시간)에 발매된다. 소속사는 &#x27;Andless&#x27;의 첫 콘셉트 사진도 함께 공개했다.</p><p>24인 전원이 함께하는 완전체 활동이라는 점에서 팬들의 관심이 모인다. 세부 트랙 구성 등은 아직 공개되지 않았다.</p>
