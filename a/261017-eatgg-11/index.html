<h1 style="font-size:20px">이천 임금님쌀밥집 — 한식조리기능장이 직접 만드는 고급 한정식</h1>
<p>핫식신의 이천 맛집 5곳 중 신둔면 수광리에 있는 한정식집이다. 한식 조리 기능장이 운영한다.</p><p>기성품을 쓰지 않고 떡갈비·보리굴비·간장게장 등을 직접 만든다는 점이 특징으로 소개됐다. 이천 쌀밥 정식 가운데서도 고급 한정식에 가까운 곳이다.</p><p>가격은 임금님정식 61,000원, 간장게장정식 50,000원, 수라정식 46,000원이다. 영업은 매일 10시 30분~21시(라스트오더 20시)다.</p>
