<h1 style="font-size:20px">금호동 은성보쌈 — 매일 아침 담그는 김치와 마장동 생고기 보쌈</h1>
<p>서울시는 오랜 업력과 뛰어난 맛, 지역의 역사·문화를 간직한 가게를 &#x27;서울 오래가게&#x27;로 인증하는데, 핫식신이 이번에 새로 선정된 다섯 곳을 소개했다. 이곳은 그중 하나다.</p><p>마장동에서 오래 거래해 온 곳의 국내산 생고기를 쓰고, 김치는 매일 아침 직접 담근다. 보쌈 종류가 다양하다.</p><p>가격은 잔치국수 6,000원, 은성보쌈(소) 38,000원, 삼겹 보쌈 50,000원~70,000원이다. 영업은 매일 12시~22시 30분이다.</p>
