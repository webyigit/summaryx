<h1 style="font-size:20px">성북동 금왕돈까스 본점 — 1987년부터, 서울 3대 경양식 돈가스</h1>
<p>핫식신이 &#x27;고즈넉한 골목에서 즐기는 여유&#x27;를 주제로 고른 성북동 인기 맛집 5곳 가운데 하나다.</p><p>1987년 문을 연 경양식 돈가스집으로, 서울 3대 경양식 돈가스 가운데 하나로 불린다고 소개됐다. 커다란 돈가스에 직접 만든 소스를 끼얹어 내고, 깍두기와 풋고추를 곁들여 준다.</p><p>가격은 등심돈가스 13,000원, 안심돈가스 14,000원, 금왕정식 15,000원이다. 화~일 10시 30분~21시 영업, 월요일은 정기휴무다.</p>
