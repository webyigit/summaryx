<h1 style="font-size:20px">백종원 김치제육볶음</h1>
<p>대표 밥반찬이자 덮밥 재료인 제육볶음에 묵은지를 더한 백종원식 김치제육볶음이다. 고추장·고춧가루·간장·설탕 양념에 앞다리살을 재웠다가 볶고, 김치와 양파를 차례로 넣어 볶아낸다.</p><p>양념은 숟가락 계량만으로 끝나고, 팬 하나로 20분 안에 만들 수 있다. 물을 조금 넣어 촉촉하게 볶는 것이 포인트이며, 맵게 먹고 싶으면 청양고추 1~2개를 더하면 된다. 남은 양념은 밥에 비벼 먹기 좋다.</p>
