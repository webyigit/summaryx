<h1 style="font-size:20px">뚝섬 신명먹거리 — 새벽 5시 40분 여는 8,000원 백반</h1>
<p>핫식신이 고른 &#x27;초가성비 백반 맛집 BEST 5&#x27; 중 뚝섬 근처 성동구 식당이다.</p><p>짭조름하면서 달큰한 집밥 맛의 반찬이 여러 가지 나오고 밥을 수북하게 담아 준다고 소개됐다. 테이블이 4개뿐이고 주차가 어렵다.</p><p>가격은 백반 8,000원, 된장찌개 9,000원, 비빔밥 7,000원이다. 새벽 5시 40분에 문을 열어 18시까지 영업하며, 일요일 휴무는 유동적이다. 이른 아침 식사가 필요한 사람에게 맞는 곳이다.</p>
