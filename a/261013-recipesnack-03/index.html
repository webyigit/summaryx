<h1 style="font-size:20px">백종원 기름떡볶이 — 간장·고춧가루 양념에 버무려 겉바속쫀</h1>
<p>국물 없이 기름에 구워 내는 통인시장식 기름떡볶이를 백종원 레시피로 만든 간식이다. 말랑하게 데친 떡에 고춧가루·간장·설탕·대파·참기름 양념을 버무린 뒤 식용유를 두른 팬에서 굽는다.</p><p>재료가 떡과 양념 몇 가지뿐이라 15분이면 완성된다. 센불에서는 양념이 타기 쉬우니 코팅팬을 쓰고 중불로 겉은 바삭, 속은 말랑하게 굽는 것이 요령이다.</p>
