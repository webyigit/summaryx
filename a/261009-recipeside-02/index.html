<h1 style="font-size:20px">백종원식 맑은 소고기무국: 볶아서 끓이는 시원한 국</h1>
<p>소고기 양지와 무를 기름에 먼저 볶은 뒤 물을 부어 끓이는 백종원식 맑은 소고기무국이다. 따로 육수를 낼 필요 없이 고기와 무를 볶는 과정에서 국물 맛이 우러나도록 한 것이 특징이다.</p><p>재료는 무·양지·대파에 다진 마늘·국간장·소금·후추 정도로 단출하다. 썰고 볶고 약불에 끓이기만 하면 되어 초보도 실패가 적고, 한 번에 3인분 정도 넉넉히 끓여 두면 며칠 아침국으로 먹기 좋다.</p>
