<h1 style="font-size:20px">백종원 시금치 프리타타 — 볶은 채소 넣은 달걀물을 약불에 뚜껑 덮고</h1>
<p>시금치·베이컨·버섯·양파·당근을 볶아 우유 넣은 달걀물에 섞고, 팬에 부어 뚜껑을 덮고 약불로 익히는 프리타타다. 작성자는 &#x27;서양 달걀찜&#x27;이라고 생각하면 된다며 간단하고 맛있어 자주 해 먹는다고 소개한다.</p><p>오븐 없이 팬 하나로 15분 안에 2인분이 완성된다. 채소는 당근을 먼저 볶고 시금치는 숨만 죽을 정도로 나중에 넣은 뒤 식혀서 달걀물에 섞는다. 밑면이 노릇해지고 윗면이 익으면 불을 끄며, 당근은 생략해도 된다.</p>
