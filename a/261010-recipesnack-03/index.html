<h1 style="font-size:20px">홈브런치 에그인헬 — 토마토소스에 달걀·치즈 올려 한 팬</h1>
<p>브런치 카페에서 볼 수 있는 토마토소스 달걀 요리 에그인헬을 집에서 간단히 만드는 레시피다. 시판 토마토소스에 소시지·베이컨·채소를 볶아 넣고, 우유를 약간 더해 맛을 부드럽게 한 &#x27;초간단 버전&#x27;이라고 작성자는 설명한다.</p><p>소스가 끓으면 가장자리에 모짜렐라치즈를 두르고 가운데 달걀을 깨 넣어 원하는 익힘으로 익히면 끝이다. 한 팬에서 만들어 그대로 식탁에 올릴 수 있고, 구운 바게트를 곁들이면 주말 아침 2인 브런치로 충분하다.</p>
