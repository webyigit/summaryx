<h1 style="font-size:20px">백종원 폭탄계란찜 — 뚝배기에 저어 익히다 뚜껑 덮어 부풀리기</h1>
<p>식당에서 보던 봉긋하게 부푼 계란찜을 뚝배기 하나로 만드는 &#x27;집밥 백선생&#x27; 백종원 방식 레시피다. 달걀 6개에 소금·설탕·맛술로 간하고 물을 조금 넣어 약불에서 저으며 익히다가 뚜껑을 덮어 부풀린다.</p><p>알끈을 빼고 맛술로 비린내를 잡는 것, 80~90% 익었을 때 윗공간이 넉넉한 뚜껑을 덮고 불을 더 줄이는 것이 핵심이다. 물을 1/2컵까지 늘리면 더 부드러워지고, 소금 대신 다진 새우젓을 써도 된다.</p>
