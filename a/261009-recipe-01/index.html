<h1 style="font-size:20px">백종원 양파덮밥</h1>
<p>양파 반 개와 계란 두 개만 있으면 되는 백종원식 한 그릇 덮밥이다. 간장·설탕·미림·물을 섞은 달큰한 양념에 양파를 부드럽게 졸이고, 계란을 부어 반숙으로 익혀 밥 위에 얹는다. 일본식 덮밥의 양념 구조를 집 재료로 단순화한 메뉴다.</p><p>냄비 하나로 10분 안에 끝나고 냉장고에 늘 있는 재료만 쓰기 때문에 반찬 없는 날 한 끼로 좋다. 계란을 휘젓지 않고 70~80%만 익혀야 부드럽고, 청양고추를 넣으면 느끼함이 줄어든다.</p>
