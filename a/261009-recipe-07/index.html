<h1 style="font-size:20px">백종원 돈가스덮밥(가츠동)</h1>
<p>시판 돈가스 하나로 만드는 일본식 가츠동이다. 간장·맛술·설탕·물로 만든 덮밥 소스에 양파를 넉넉히 익히고, 썬 돈가스 위에 계란을 둘러 부어 반숙으로 마무리한다.</p><p>냉동 돈가스를 쓰면 손이 훨씬 덜 가고, 소스 비율만 기억하면 오야코동·규동 등 다른 덮밥에도 응용할 수 있다. 원문에는 백종원 원래 비율(물 9·간장 3·맛술 3·설탕 2)도 함께 적혀 있다.</p>
