<h1 style="font-size:20px">백종원 콩나물불고기 — 대패삼겹살과 콩나물을 한 팬에</h1>
<p>콩나물을 듬뿍 넣어 아삭하게 즐기는 백종원식 콩나물불고기(콩불) 레시피다. 팬에 콩나물을 깔고 대패삼겹살과 채소를 올린 뒤 간장·고추장 양념을 한꺼번에 부어 익히는 방식이라 볶는 수고가 적다.</p><p>콩나물에서 나오는 수분으로 익히다가 타닥거리는 소리가 나면 뒤적이면 되고, 국물 양은 불 세기로 조절한다. 작성자는 매콤달달한 양념이 언제 먹어도 맛있다며, 완성 후 깻잎에 고기와 채소를 싸 먹는 방법을 소개한다.</p>
