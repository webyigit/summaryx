<h1 style="font-size:20px">또띠아 마늘칩 — 마늘버터 바르고 잘라 오븐 5~8분</h1>
<p>녹인 버터에 다진마늘·파슬리가루·꿀을 섞은 소스를 또띠아에 펴 바르고, 가위로 잘라 오븐에 구운 바삭한 칩이다. 작성자는 누구나 간단히 만들 수 있는 또띠아칩에 마늘과 버터를 더해 더 맛있다고 소개한다.</p><p>재료는 또띠아 2~3장과 소스 재료 네 가지뿐이고 180℃ 오븐에서 5~8분 구우면 돼 10분 안에 2인분이 완성된다. 구울 때 중간중간 상태를 확인하고, 마늘을 좋아하면 양을 늘려도 된다. 버터는 미리 실온에 꺼내 두면 섞기 편하다.</p>
