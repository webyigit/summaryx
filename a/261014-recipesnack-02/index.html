<h1 style="font-size:20px">백종원 옥수수전 — 콘·튀김가루·물로 5분, 연유 뿌려 먹기</h1>
<p>통조림 옥수수에 튀김가루와 물만 섞어 팬에 얇게 부치는 백종원식 옥수수전이다. 작성자는 5분이면 뚝딱 만들 수 있고 아이도 잘 먹는 고소한 전이라고 소개한다.</p><p>반죽을 찰지게 섞는 것이 포인트이고, 팬에 너무 두껍게 올리면 알갱이가 나중에 부서지니 고르게 얇게 펴야 한다. 완성 후 연유를 뿌려 먹는 것이 기본이며, 연유가 없으면 칠리소스를 곁들여도 된다.</p>
