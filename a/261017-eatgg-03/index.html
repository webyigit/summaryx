<h1 style="font-size:20px">성남 진선보쌈 — 부부가 40년 넘게 하루 200인분만 내는 보쌈</h1>
<p>핫식신의 &#x27;성남 대표 맛집 5곳&#x27;에 든 수정구의 보쌈 전문점이다. 부부가 40년 넘게 운영해 왔고, TV 프로그램 &#x27;허영만의 백반기행&#x27;에 나오며 더 알려졌다.</p><p>하루 약 200인분만 판다고 소개돼 늦게 가면 맛보기 어려울 수 있다. 굴이 나는 철에는 굴보쌈이 특히 인기라고 한다.</p><p>가격은 보쌈(대) 60,000원, 보쌈 중 48,000원이다. 영업은 매일 11시 30분~21시이고 14~16시는 쉬는 시간, 월요일은 휴무다.</p>
