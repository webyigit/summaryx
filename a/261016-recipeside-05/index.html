<h1 style="font-size:20px">백종원 느타리 두루치기 — 버섯·채소 양념에 버무려 볶기만</h1>
<p>느타리버섯과 양파·애호박·고추·대파를 고추장·고춧가루·간장 양념에 버무려 팬에 볶는 버섯 두루치기다. 작성자는 쫄깃한 느타리와 매콤한 두루치기 양념의 만남이라며, 맛남의 광장 백종원 레시피라고 소개한다.</p><p>고기 없이 버섯 300g과 채소, 섞기만 하는 양념장으로 15분 안에 3인분이 완성된다. 버무리다 보면 채소에서 물이 나와 양념이 잘 배고, 볶을 때 불린 당면을 넣어도 좋다고 한다. 마지막에 통깨를 뿌려 마무리한다.</p>
