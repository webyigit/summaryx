<h1 style="font-size:20px">백종원식 계란국 — 멸치육수에 부드럽게 푼 아침국</h1>
<p>멸치육수에 양파를 넣어 끓이다 계란을 풀어 넣는 백종원식 계란국이다. 작성자는 가족이 좋아해 자주 끓이는 국으로, 날이 쌀쌀해질 때 아침국으로 잘 어울린다고 소개한다.</p><p>계란물을 붓고 바로 젓지 않고, 계란이 떠오를 때 두세 번만 살살 저어야 몽글하고 보드라운 결이 산다는 것이 요령이다. 간은 국간장·다진 마늘·소금으로 하고 마지막에 부추를 넣는다. 2인분 15분 이내로 표기돼 있다.</p>
