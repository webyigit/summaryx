<h1 style="font-size:20px">매콤달콤 어묵꼬치 — 고추장 양념에 졸이는 주말 간식</h1>
<p>사각 어묵을 나무젓가락에 끼워 고추장 양념에 졸이는 분식점 스타일 매콤 어묵꼬치다. 재료는 어묵과 고추장·고춧가루·올리고당뿐이라 장보기 없이 냉장고 재료로 바로 만들 수 있다.</p><p>양념이 잘 배게 하려면 라면 냄비처럼 깊은 냄비를 써서 어묵이 잠기게 하고, 프라이팬을 쓸 때는 양념을 중간중간 위에 끼얹어 주라는 팁이 있다. 20분 안에 2인분이 완성되는 주말 간식이다.</p>
