<h1 style="font-size:20px">강북 샘터마루 — 무량사 입구 산자락의 테라스 육개장</h1>
<p>핫식신의 &#x27;줄 서서 먹는 육개장 맛집 BEST 5&#x27;에 든 강북구 식당으로, 무량사 입구 근처 산자락에 있다. 실내 좌식 자리와 바깥 테라스가 있다.</p><p>얼큰한 육개장은 소뼈 육수에 대파·사태·고사리·당면을 넣어 끓인다. 이 밖에 황태북어국, 비빔밥, 오뎅 백반도 판다.</p><p>가격은 육개장 9,000원, 곱창육개장 12,000원, 선지해장국 9,000원이다. 매일 아침 6시 30분부터 20시까지 열어 북한산 산행 전후 식사에 맞는다.</p>
