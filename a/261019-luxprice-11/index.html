<h1 style="font-size:20px">아크네 스튜디오 &#x27;레이어드 코튼 미니 드레스&#x27;, 공식몰 ₩1,140,000</h1>
<p>아크네 스튜디오 한국 공식몰 여성 신상품(New Arrivals) 목록에 &#x27;레이어드 코튼 미니 드레스&#x27;가 올라 있다. 네이비/블랙과 화이트 두 색상이 있고 공식몰 표기 가격은 둘 다 ₩1,140,000이다.</p><p>같은 목록에서 체크 코튼-린넨 셔츠와 루즈핏 진 1981(워시드 블랙)도 ₩1,140,000으로 나와 있어, 아크네 여성 신상품 가운데 비교적 낮은 100만원대 초반 가격대에 속한다.</p>
