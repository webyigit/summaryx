<h1 style="font-size:20px">백종원 감자볶음: 데쳐서 볶는 담백한 감자반찬</h1>
<p>국민 반찬 감자볶음을 백종원 방식으로 담백하게 만드는 레시피다. 작성자는 처음엔 전분을 씻지 않고 볶았다가, 감자를 한 번 헹구고 소금물에 익혀 볶으니 훨씬 깔끔한 맛이 났다고 소개한다.</p><p>감자를 미리 소금물에 익혀 두기 때문에 팬에서는 양파·당근과 섞어 간만 맞추면 되고, 감자가 타거나 덜 익을 걱정이 적다. 재료도 감자·당근·양파에 소금·후추뿐이라 아이 반찬으로도 무난하다.</p>
