<h1 style="font-size:20px">백종원 두부부침 — 계란물 입혀 중약불에 노릇하게</h1>
<p>두부를 1.5cm 두께로 썰어 소금·후추로 간한 계란물을 입혀 부치는 반찬이다. 쪽파나 대파를 다져 계란물에 섞고, 당근을 모양틀로 찍어 얹으면 아이 반찬으로도 보기 좋다.</p><p>부치기 전 키친타월로 두부 물기를 닦아야 계란물이 잘 붙고, 단단한 부침용 두부를 써야 부서지지 않는다. 불이 세면 계란이 타니 중약불에서 천천히 익히는 것이 요령이며, 10분 안에 완성된다.</p>
