<h1 style="font-size:20px">백종원 김치콩나물국 — 멸치육수에 신김치, 뚜껑 열고 콩나물</h1>
<p>멸치육수에 신김치와 콩나물을 넣어 칼칼하게 끓이는 백종원식 김치콩나물국이다. 재료는 콩나물 한 봉지와 김치 3T, 마늘·국간장·소금 정도라 냉장고 재료로 바로 끓일 수 있다.</p><p>작성자는 국물 양에 따라 간이 달라지니 국간장과 소금을 넣기 전 반드시 맛을 보라고 강조한다. 콩나물은 뚜껑을 연 채 삶아야 비린내가 날아가고, 파는 어슷썰기로 넣으면 보기 좋다. 20분 안에 4인분이 완성된다.</p>
