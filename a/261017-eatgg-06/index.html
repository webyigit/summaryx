<h1 style="font-size:20px">성남 미래식당 — 효자촌 상가의 푸짐한 해물찜·아구찜</h1>
<p>핫식신이 소개한 성남 대표 맛집 5곳 중 분당 효자촌 미래타운 상가에 있는 해물 요리집이다.</p><p>오징어·문어·전복·주꾸미 등 신선한 해산물을 듬뿍 넣은 해물찜이 대표로, 양념이 자극적이지 않아 해산물 맛이 살아 있다는 평이다. 양이 넉넉하고 가격 대비 만족도가 높다는 점이 인기 이유로 꼽혔다.</p><p>가격은 아구찜(소) 60,000원, 해물찜(소) 70,000원, 해물탕(소) 70,000원이며 영업은 매일 11시~21시 30분이다.</p>
