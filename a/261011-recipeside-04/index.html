<h1 style="font-size:20px">백종원 볶음김치 — 설탕·참기름 한 스푼씩, 5분 반찬</h1>
<p>묵은지를 가장 간단하게 반찬으로 바꾸는 백종원식 볶음김치다. 김치를 썰어 기름에 볶다가 설탕 1스푼으로 신맛을 누르고 참기름 1스푼으로 고소하게 마무리하는 것이 전부다.</p><p>조리 시간 5분 이내, 난이도 &#x27;아무나&#x27;로 이번 반찬 중 가장 빠르다. 통깨를 뿌려 그대로 반찬으로 내거나 두부·계란말이 곁들임, 볶음밥 재료로 쓰기 좋다.</p>
