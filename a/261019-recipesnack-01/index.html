<h1 style="font-size:20px">백종원 스팸주먹밥 — 스팸 통에 랩 깔고 눌러 찍기</h1>
<p>다 먹은 스팸 통에 랩을 깔고 김·밥·볶은 김치·구운 스팸·채소·밥을 차례로 채워 눌러 빼는 사각 주먹밥이다. 같은 방법으로 고추장·후추에 버무린 참치 속 주먹밥도 만든다.</p><p>원문 기준 15분 이내 2인분(주먹밥 4개)이고, 속재료는 반찬으로 쓸 수 있는 것이면 무엇이든 된다고 작성자는 설명한다. 랩으로 싸서 냉장 보관해 두고 꺼내 먹기 좋으며, 아이들이 좋아해 자꾸 만들어 달라고 한다는 후기가 있다.</p>
