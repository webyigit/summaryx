<h1 style="font-size:20px">성남 그집 — 여름이면 줄 서는 서현 판모밀·돌냄비우동</h1>
<p>핫식신이 꼽은 성남 대표 맛집 가운데 분당 서현의 메밀국수 전문점이다. 여름이면 대기 줄이 길게 늘어서는 곳으로 소개됐다.</p><p>면발이 보통보다 조금 가늘어 부드럽게 넘어가는 판모밀이 대표 메뉴이고, 찐만두를 곁들여 먹는 손님이 많다. 날이 쌀쌀해지면 끝까지 뜨겁게 유지되는 돌냄비 우동도 인기다.</p><p>가격은 판모밀국수 10,000원, 찐만두 7000원, 돌냄비 우동 12,000원이며 영업은 매일 11시~21시다.</p>
