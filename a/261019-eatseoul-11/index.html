<h1 style="font-size:20px">을지로 부민옥 — 60년 된 다동 육개장과 양무침</h1>
<p>핫식신의 &#x27;줄 서서 먹는 육개장 맛집 BEST 5&#x27;에 든 을지로 다동의 노포로, 60년 가까이 영업해 왔다. 유명 매스컴에 소개된 뒤 더 알려졌다고 한다.</p><p>6~7시간 우린 사골 육수에 소금과 고춧가루만으로 간을 해 육개장을 끓인다. 양무침은 술손님을 부르는 인기 메뉴로 꼽혔다.</p><p>가격은 육개장 10,000원, 양곰탕 11,000원, 복국 13,000원이다. 11~22시 영업에 14~17시는 쉬는 시간이며 일요일은 휴무다.</p>
