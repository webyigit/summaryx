<h1 style="font-size:20px">도미노피자, 12일부터 피자값 4.4% 인상…5년 만의 조정</h1>
<p>도미노피자가 10월 12일부터 피자 제품 가격을 평균 4.4% 올린다. 제반 비용 상승 부담이 쌓였다는 이유로, 2022년 이후 약 5년 만의 가격 조정이다. 인상 폭은 L 사이즈 1,500원, M 사이즈 1,000원이다.</p><p>도미노피자 관계자는 지난 5년간 물가 안정 기조에 동참하려고 가격을 유지해 왔지만 비용 상승 압박이 커져 부득이하게 조정하게 됐다고 설명했다.</p>
