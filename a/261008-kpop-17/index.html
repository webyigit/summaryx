<h1 style="font-size:20px">황민현, 디지털 싱글 &#x27;OUR&#x27;로 컴백</h1>
<p>가수 겸 배우 황민현이 10월 7일 오후 6시(한국시간) 디지털 싱글 &#x27;OUR&#x27;를 발표하고 뮤직비디오를 함께 공개했다.</p><p>&#x27;OUR&#x27;는 미니멀한 구성의 미디엄 템포 팝 곡이다. 계절이 바뀌고 익숙한 날들이 지나가도 한 사람을 향한 마음은 변하지 않는다는 이야기를 솔직하게 담았다. 세련된 분위기의 뮤직비디오로 곡의 감성을 표현했다.</p><p>황민현은 최근 드라마 &#x27;스터디그룹&#x27; 등 연기 활동도 병행하고 있어, 이번 싱글은 가수로서의 활동을 이어가는 의미가 있다.</p>
