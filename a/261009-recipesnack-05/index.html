<h1 style="font-size:20px">류수영 콘치즈 — 마늘 마요로 볶는 맥주 안주</h1>
<p>방송에서 류수영(어남선생)이 소개해 화제가 된 콘치즈를 집에서 따라 만든 레시피다. 마요네즈에 다진 마늘을 먼저 볶아 향을 낸 뒤 물기를 뺀 스위트콘을 넣어 수분을 날리고, 모차렐라를 올려 뚜껑을 덮고 녹이면 완성된다.</p><p>재료가 콘 통조림, 마요네즈, 마늘, 치즈 네 가지뿐이고 팬 하나로 15분이면 끝난다. 작성자는 가게 것보다 느끼함이 덜하고 치즈를 마음껏 넣을 수 있어 좋다며, 맥주 안주는 물론 아이 간식으로도 어울린다고 적었다.</p>
