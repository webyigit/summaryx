<h1 style="font-size:20px">석촌 황도바지락칼국수 — 호박 넣은 노란 면, 보리밥·막걸리 무료</h1>
<p>핫식신이 고른 전국 바지락 칼국수 맛집 5곳 중 서울 송파의 가게다.</p><p>석촌역 앞에서 오래 영업해 온 칼국수집이다. 호박을 넣어 노랗게 만든 면을 24시간 저온 숙성해 쓰고, 국물은 짜지 않다는 평이다.</p><p>1인 1메뉴를 주문하면 보리밥과 막걸리를 무료로 준다. 가격은 칼국수 13,000원, 왕만두 7,000원, 미니보쌈 17,000원이고 매일 10시~22시 영업한다.</p>
