<h1 style="font-size:20px">백종원 카레우동 — 우유에 카레가루 풀어 5분</h1>
<p>물 대신 우유에 카레가루를 풀어 끓이고 우동면을 넣어 졸이는 초간단 카레우동이다. 작성자는 &#x27;초초초간단 카레우동레시피&#x27;라고 소개하며, 재료는 우동사리·카레가루·우유 세 가지뿐이다.</p><p>팬 하나에 우유를 끓이고 카레가루를 뭉치지 않게 풀어 면을 넣으면 끝나 5분 이내로 완성된다. 원문 재료 목록에는 카레가루 3T, 조리 순서에는 2T로 적혀 있어 입맛에 맞게 농도를 조절하면 된다.</p>
