<h1 style="font-size:20px">백종원 도라지무침 — 소금·설탕·식초로 주물러 쓴맛 빼기</h1>
<p>손질한 도라지를 소금·설탕·식초에 주물러 쓴맛을 빼고, 고추장·매실청·고춧가루·식초 양념장에 무치는 새콤달콤한 도라지 생채다. 작성자는 쓴맛은 빼고 쌉싸름한 맛은 살렸다고 소개한다.</p><p>익히는 과정 없이 절이고 헹궈 무치기만 해 원문 기준 30분 이내 4인분이다. 도라지가 잘 구부러지면 다 절여진 것이니 깨끗이 헹궈 물기를 꽉 짜는 것이 포인트이고, 설탕·식초 양은 입맛에 따라 조절하면 된다.</p>
