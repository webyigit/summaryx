<h1 style="font-size:20px">정동 덕수정 — 1970년대부터 덕수궁 옆 오징어볶음</h1>
<p>핫식신의 &#x27;불맛 가득 오징어볶음 맛집 5곳&#x27;에 든 정동길 식당으로, 1970년대부터 덕수궁 근처에서 영업해 왔다.</p><p>큼직하게 썬 오징어와 양파를 빠르게 볶아 은은한 불맛을 내며, 흰쌀밥 위에 얹어 먹는 것이 보통이라고 소개됐다. 부대찌개도 함께 판다.</p><p>가격은 오징어 볶음 14,000원, 부대찌개 10,000원이다. 11~21시 영업에 15~17시는 쉬는 시간이고 일요일은 쉰다. 덕수궁·정동길 산책과 묶어 들르기 좋은 위치다.</p>
