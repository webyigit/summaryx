<h1 style="font-size:20px">우유 계란 프렌치토스트 — 10분 브런치</h1>
<p>달걀·우유·설탕·소금을 섞은 물에 식빵을 푹 적셔 버터에 구운 기본 프렌치토스트다. 작성자는 바쁜 날 가족 끼니로 빠르게 만들었다며 우유 한 잔을 곁들이면 든든한 한 끼가 된다고 소개한다.</p><p>식빵 2장에 달걀 2개, 우유 50ml면 충분하고 조리 시간은 10분 이내다. 빵을 오래 적실수록 속이 부드러워지고, 버터는 금방 타므로 중약불로 구워야 겉만 타지 않는다는 팁이 핵심이다. 마지막에 슈가파우더를 뿌리면 카페 브런치 느낌이 난다.</p>
