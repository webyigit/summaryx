<h1 style="font-size:20px">김 치즈말이 스틱 — 라이스페이퍼로 감싸 10분 튀김</h1>
<p>스트링치즈를 라이스페이퍼로 한 번, 곱창김으로 한 번 더 말아 기름에 빠르게 튀겨 내는 간식이다. 작성자는 간식이나 술안주로 좋다고 소개한다.</p><p>튀김 반죽 대신 라이스페이퍼를 써서 기름이 적게 들고 튀김가루가 떨어지지 않아 깔끔하다는 것이 작성자의 설명이다. 원문 기준 10분 이내 1인분이며, 기름 온도가 낮으면 바삭하지 않으니 약 180도로 달군 뒤 앞뒤로 빠르게 튀기라고 한다.</p>
