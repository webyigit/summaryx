<h1 style="font-size:20px">성북동 성북동빵공장 — 천연 발효종·AOP 버터로 굽는 대형 베이커리</h1>
<p>핫식신이 &#x27;고즈넉한 골목에서 즐기는 여유&#x27;를 주제로 고른 성북동 인기 맛집 5곳 가운데 하나다.</p><p>천연 발효종과 프랑스 AOP 버터, 유기농 밀가루, 방사 유정란을 쓰는 베이커리 카페다. 합성 첨가물을 쓰지 않고 탕종법으로 반죽하며, 생크림을 채우고 슈가파우더를 뿌린 팡도르가 시그니처다.</p><p>가격은 성북동식빵 6,300원, 생크림팡도르 7,800원이다. 매일 오전 10시에 문을 연다(마감 시각은 원문에서 잘려 확인 필요).</p>
