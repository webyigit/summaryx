<h1 style="font-size:20px">백종원 감자전 — 간 감자에 가라앉은 녹말까지, 감자 100%</h1>
<p>밀가루 없이 감자만 갈아 부치는 백종원식 감자전이다. 믹서에 간 감자를 체에 거르고, 걸러진 물을 15분 두어 바닥에 가라앉은 녹말만 다시 섞어 쫄깃함을 살린다. 채 썰어 부치는 감자채전과 달리 쫀득한 식감이 특징이다.</p><p>기름은 처음에 적게 두르고 가장자리가 익으면 조금씩 더하는 것이 뒤집기 쉬운 요령이다. 소금으로만 살짝 간하고 홍고추를 고명으로 얹으며, 초간장이나 장아찌와 곁들이면 좋다. 15분 이내로 3인분이 완성된다.</p>
