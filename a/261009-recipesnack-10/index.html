<h1 style="font-size:20px">바삭한 감자채전 — 감자 전분으로 붙이는 얇은 전</h1>
<p>채 썬 감자에 당근을 조금 섞어 얇고 바삭하게 부치는 감자채전이다. 감자를 갈아 만든 즙과 감자 물에 가라앉은 전분을 반죽에 넣어 부침가루 없이도 잘 붙게 만드는 것이 이 레시피의 요령이다.</p><p>감자 3개로 전 6장이 나오고 30분 안쪽이면 된다. 소금이 수분을 끌어내므로 부치기 전에 물기를 따라 내고, 약불보다 중강불에 기름을 넉넉히 둘러 최대한 얇게 펴야 바삭해진다. 갈기 번거로우면 소금에 절여 물기를 빼고 밀가루를 조금 넣어도 된다.</p>
