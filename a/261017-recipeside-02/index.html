<h1 style="font-size:20px">백종원 알배추 겉절이 — 집밥백선생 초보용 겉절이</h1>
<p>집밥백선생에서 소개된 방식으로 알배추·부추·양파를 버무리는 배추겉절이다. 작성자는 초보도 쉽게 따라 할 수 있다고 소개한다.</p><p>배추를 비스듬히 썰어 40분 절이고, 고춧가루·멸치액젓·새우젓·다진 마늘·설탕 양념을 미리 섞어 불려 두었다가 조금씩 넣어 버무리면 된다. 김치처럼 숙성할 필요 없이 바로 먹는다. 후기 157건 중 가장 많은 의견은 달다는 것이라 설탕을 절반쯤 줄이라는 조언이 많고, 알배추는 소금을 줄여 절이라는 팁도 있다.</p>
