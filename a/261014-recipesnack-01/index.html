<h1 style="font-size:20px">백종원 추억의 사라다빵 — 뜨거운 감자에 양파 넣어 으깨기</h1>
<p>&#x27;집밥 백선생&#x27;에서 미공개 레시피로 공개된 백종원의 추억의 사라다빵이다. 삶은 감자를 으깨 양파·당근·단무지·햄을 섞고 마요네즈·설탕·식초·소금·후추로 버무려 빵 위에 듬뿍 올린다.</p><p>감자를 10~15분 삶는 동안 나머지 재료를 잘게 썰면 돼 30분 안에 2인분이 완성된다. 감자가 뜨거울 때 으깨면서 양파를 넣으면 열기로 알싸한 맛이 줄고, 설탕과 식초는 같은 양을 넣는 것이 포인트다. 단무지는 양배추로 바꿔도 된다.</p>
