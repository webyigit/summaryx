<h1 style="font-size:20px">백종원 분식점 떡볶이 — 떡 2컵·물 2컵, 15분 완성</h1>
<p>분식점 맛을 내는 백종원식 떡볶이 레시피다. 떡과 물을 같은 양(2컵씩)으로 맞추고, 고추장 2·고춧가루 1.5·간장 2·설탕 3 비율의 양념만 넣어 끓이는 구성이라 계량이 쉽다. 작성자는 만드는 법이 너무 간단한데 맛있어서 놀랐다고 소개한다.</p><p>따로 육수를 내지 않고 맹물에 양념만 풀어 끓이며, 냉동 떡은 잠시 물에 불렸다 쓰면 된다. 국물이 졸아들 때 대파를 넣으면 끝이다. 2인분 15분이면 되는 방과 후·주말 간식이다.</p>
