<h1 style="font-size:20px">에어프라이어 베이컨 에그 오픈토스트 — 집에서 만드는 브런치</h1>
<p>식빵 가운데를 눌러 홈을 만들고 베이컨·달걀·모차렐라를 올려 에어프라이어로 굽는 오픈토스트다. 작성자는 예전에 TV에서 본 메뉴를 기억해 만들었다며, 집에서 브런치 카페 기분을 낼 수 있는 메뉴로 소개한다.</p><p>180도에서 약 8분 구우면 노른자가 촉촉한 반숙, 10분 이상이면 완숙이 된다. 팬이나 불 앞에 설 필요 없이 올려서 굽기만 하면 되고, 2인분 30분 이내로 표기돼 있다.</p>
