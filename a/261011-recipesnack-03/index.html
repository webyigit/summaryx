<h1 style="font-size:20px">고구마 경단 — 찐 고구마에 견과 넣고 카스텔라 옷</h1>
<p>남은 찐 고구마로 만드는 아이 간식 겸 디저트다. 고구마를 곱게 으깨 찹쌀가루·소금·우유로 반죽하고, 견과류와 크랜베리를 속에 넣어 동그랗게 빚는다.</p><p>김 오른 찜기에 5분 찌고 불을 끈 채 5분 뜸 들인 뒤, 따뜻할 때 체에 내린 카스텔라 가루를 굴려 입히면 완성이다. 고구마 상태에 따라 가루와 우유 양을 조절하라는 팁이 있으며 30분 이내 초급 메뉴다. 백종원 레시피는 아니다.</p>
