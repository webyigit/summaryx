<h1 style="font-size:20px">마포 육장 — 5시간 우린 양지 육수의 육개장과 육라면</h1>
<p>핫식신의 &#x27;줄 서서 먹는 육개장 맛집 BEST 5&#x27; 첫 번째로 소개된 마포구 포은로의 식당이다.</p><p>육개장 국물을 바탕으로 탕·갈비탕·라면을 만든다. 대표 메뉴 육라면은 5시간 넘게 끓인 양지 육수에 손으로 찢은 소고기와 쫄깃한 면을 넣는다. 토마토를 더한 토마토육장도 있다.</p><p>가격은 육개장 11,000원, 육갈탕 15,000원, 토마토육장 12,000원이다. 매일 11~20시 영업하고 15~17시는 쉰다.</p>
