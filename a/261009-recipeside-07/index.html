<h1 style="font-size:20px">백종원 시금치무침: 1분 데쳐 무치는 15분 나물</h1>
<p>백종원의 집밥 메뉴로 소개된 시금치무침이다. 소금물에 1분 데친 시금치를 대파·간장·소금·다진 마늘로 무치고 참기름·통깨로 마무리하는 기본 나물 반찬이다.</p><p>15분 이내에 끝나는 초급 메뉴로, 시금치 물기를 너무 꽉 짜면 수분이 빠져 맛이 없다는 팁이 핵심이다. 데치고 헹구고 무치는 세 단계뿐이라 처음 나물을 무쳐 보는 사람에게도 알맞다.</p>
