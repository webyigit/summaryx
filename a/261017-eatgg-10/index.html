<h1 style="font-size:20px">이천 나랏님이천쌀밥 — 솥밥과 계절 반찬, 넓은 주차장의 쌀밥 정식</h1>
<p>핫식신의 이천 맛집 기사에 소개된 사음동의 이천 쌀밥 정식집이다. 이천 쌀로 지은 솥밥과 계절 반찬이 강점으로 꼽혔다.</p><p>대표인 나랏님정식에는 떡갈비와 쭈꾸미볶음이 더해진다. 기본 이천쌀밥정식부터 갈비찜정식까지 고를 수 있고, 주차장이 넓어 단체·가족 방문이 편하다.</p><p>가격은 나랏님정식 29,000원, 이천쌀밥정식 18,000원, 갈비찜정식 38,000원이며 영업은 매일 10시~21시(라스트오더 20시)다.</p>
