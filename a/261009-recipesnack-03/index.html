<h1 style="font-size:20px">분식집 떡꼬치 — 케첩 베이스 달콤 소스</h1>
<p>학교 앞 분식집에서 사 먹던 떡꼬치를 집에서 재현하는 레시피다. 떡을 살짝 데쳐 꼬치에 끼운 뒤 기름 두른 팬에 노릇하게 굽고, 케첩·고추장·간장·설탕·올리고당을 섞어 한 번 끓인 소스를 발라 마무리한다.</p><p>소스 재료가 대부분 집에 있는 양념이고, 고추장은 반 큰술만 넣어 아이들도 맵지 않게 먹을 수 있다. 다진 마늘은 빼도 되고, 꼬치도 떡 데친 물에 함께 삶아 쓰면 돼 손이 덜 간다. 4인분 기준 30분 안에 끝난다.</p>
