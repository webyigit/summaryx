<h1 style="font-size:20px">짜장떡볶이 — 짜장가루에 고추장·간장 더한 백종원 스타일</h1>
<p>짜장가루에 고추장·진간장·설탕을 섞은 양념으로 끓이는 짜장떡볶이다. 작성자는 짜장가루만 쓰면 느끼할 수 있어 고추장과 진간장을 더했고, 돼지고기 다짐육을 볶아 넣어 식감과 고소함을 살렸다고 설명한다.</p><p>떡·어묵·양파·대파 같은 분식 재료에 양념을 미리 섞어 두면 30분 안에 2인분이 완성된다. 딱딱한 떡은 미리 데쳐 뿌연 물을 빼고 넣는 것이 좋다고 한다.</p>
