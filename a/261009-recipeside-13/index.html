<h1 style="font-size:20px">백종원식 무조림 — 생선 없이 멸치로 맛내는 밥반찬</h1>
<p>값싼 무 반 개로 생선 없이 만드는 백종원식 무조림이다. 멸치 한 줌(작성자는 건새우도 추가)으로 감칠맛을 내고, 간장·고춧가루·설탕·마늘 양념을 물과 함께 한꺼번에 넣어 끓이는 단순한 방식이다.</p><p>센불에 10분 끓인 뒤 중불로 졸이면 되고, 국물이 넉넉해 생선조림처럼 양념을 계속 끼얹을 필요가 없다는 점이 간편하다. 굵게 썬 무에 양념이 배어 익으면 완성으로, 3인분 30분 이내로 표기돼 있다.</p>
