<h1 style="font-size:20px">가장 웃긴 농구 장면 순위 쇼츠</h1>
<p>‘Sports Moment Ranked’ 채널의 쇼츠로, 제목은 ‘가장 웃긴 농구 순간 순위’입니다. 농구 경기나 연습 중 나온 웃긴 장면들을 모아 순위를 매기는 스포츠 랭킹 영상입니다.</p><p>2026년 10월 10일 기준 미국 주간 인기 쇼츠 집계(kabo.sh)에서 약 190만 회로 28위에 올랐습니다. 업로드 약 4일 만의 기록입니다. 스포츠의 명장면 대신 실수·웃음 장면을 모은 랭킹 쇼츠로, 이번 주 유행한 ‘순위 매기기’ 포맷의 스포츠 버전입니다.</p>
