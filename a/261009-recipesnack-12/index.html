<h1 style="font-size:20px">에어프라이어 식빵 핫도그 — 식빵으로 말아 굽는 아이 간식</h1>
<p>얇게 민 식빵에 토마토소스와 치즈를 깔고 소시지를 말아 에어프라이어로 굽는 식빵 핫도그다. 반죽이나 튀김 없이 겉은 바삭하고 속은 치즈가 듬뿍 들어가 아이 간식이나 브런치로 좋다고 소개한다.</p><p>소시지에 지그재그 칼집을 내면 모양이 예쁘고, 녹인 버터에 설탕·파슬리를 섞어 겉에 바르면 달콤하게 구워진다. 180도 예열 후 7~8분이면 완성되며 2인분 20분 이내로 표기돼 있다. 소스 대신 마요네즈를 써도 된다.</p>
