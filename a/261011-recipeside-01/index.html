<h1 style="font-size:20px">백종원 진미채볶음 — 불려서 마요네즈로 부드럽게</h1>
<p>딱딱해지기 쉬운 진미채를 부드럽게 만드는 백종원식 볶음 반찬이다. 진미채를 물에 5분쯤 불려 물기를 빼고 가위로 잘라 두는 것이 첫 단계다.</p><p>팬에 양념(고춧가루·고추장·설탕·다진 마늘·맛술·올리브유)을 약불로 끓이다 진미채를 넣어 버무리고, 불을 끈 뒤 올리고당·마요네즈·참기름을 넣어 섞는다. 마요네즈가 식어도 촉촉함을 지켜 준다. 4인분 30분 이내 초급 반찬이다.</p>
