<h1 style="font-size:20px">백종원식 감바스 — 마늘 오일에 새우·방울토마토</h1>
<p>냉동 새우로 만드는 감바스 알 아히요다. 올리브유에 으깬 통마늘·베트남 고추·맛소금을 넣고 중약불에서 마늘이 노릇해질 때까지 오일을 우리는 것이 맛의 바탕이다.</p><p>새우와 반으로 자른 방울토마토를 넣어 새우가 익을 때까지 끓이고, 원문은 살짝 데친 브로콜리도 더한다. 후추·파슬리 가루를 뿌리고 구운 바게트나 식빵을 곁들이면 홈파티·와인 안주가 된다. 4인분 30분 이내.</p>
