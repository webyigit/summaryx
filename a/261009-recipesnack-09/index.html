<h1 style="font-size:20px">노밀가루 바나나 팬케이크 — 재료 두 가지 5분 간식</h1>
<p>바나나 1개와 달걀 1개만 섞어 팬에 부치는 밀가루 없는 팬케이크다. 다이어트 식품으로 자주 쓰이는 두 재료로 만들어 밀가루를 피하는 사람이나 식단 관리 중인 사람에게 맞는 간식으로 소개된다.</p><p>바나나를 으깨 달걀과 섞으면 반죽이 끝나 계량도 필요 없고 조리 시간은 5분 이내다. 반죽이 묽어 큰 팬케이크보다 한입 크기로 작게 부쳐야 뒤집기 쉽다. 단맛은 바나나가 내므로 시럽은 취향에 맞춰 조금만 곁들이면 된다.</p>
