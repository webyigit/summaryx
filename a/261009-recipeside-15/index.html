<h1 style="font-size:20px">백종원식 부추무침 — 버무리기만 하는 새콤 매콤 반찬</h1>
<p>부추 한 줌과 양파 반 개를 간장·고춧가루 양념에 버무리는 백종원식 부추무침이다. 작성자는 훈제오리에 곁들이려고 만들었으며, 고기 요리 옆에 두기 좋은 새콤 매콤한 반찬으로 소개한다.</p><p>양파는 얇게 썰어 얼음물에 담가 매운맛을 빼고, 양념은 진간장·고춧가루·마늘·올리고당·식초·통깨·참기름을 섞으면 된다. 부추에서 풋내가 나지 않게 살살 버무리는 것이 요령이며, 불을 쓰지 않아 금방 만든다.</p>
