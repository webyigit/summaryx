<h1 style="font-size:20px">백종원 홍콩식 프렌치토스트 — 튀기듯 굽고 연유·버터</h1>
<p>소금 한 꼬집 넣은 달걀물에 식빵을 적셔 기름에 튀기듯 굽고, 두 장을 포개 연유를 뿌린 뒤 버터를 올리는 홍콩식 프렌치토스트다. 작성자는 커피와 곁들이기 좋은 초간단 간식으로 소개한다.</p><p>식빵 2장, 달걀 2개, 버터와 연유만 있으면 5분 안에 1인분이 완성된다. 연유는 뜨거울 때 뿌리고 단맛이 싫으면 양을 줄이며, 버터를 미리 상온에 꺼내 두면 잘 녹는다. 취향에 따라 아몬드 슬라이스를 뿌려도 된다.</p>
