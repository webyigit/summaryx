<h1 style="font-size:20px">백종원 파무침 — 파채에 참기름부터 버무려 무르지 않게</h1>
<p>대파를 파채로 썰어 참기름에 먼저 버무린 뒤 식초·간장·고춧가루·설탕·깨 양념에 무치는 파무침이다. 작성자는 돼지고기구이나 삼겹살에 빠질 수 없는 반찬을 대파로 쉽게 만드는 방법이라고 소개한다.</p><p>대파 2줄과 양념 여섯 가지로 세 단계면 끝나 10분 안에 4인분이 완성된다. 참기름을 먼저 버무리는 이유는 파채를 코팅해 무르지 않게 하기 위해서다. 남은 파채는 두부조림·라면·볶음밥·계란국 등에 활용할 수 있다.</p>
