<h1 style="font-size:20px">백종원 또띠아토스트 — 베이컨 달걀 올려 말아 굽는 브런치</h1>
<p>버터에 구운 또띠아에 베이컨·양파와 달걀프라이를 올리고 설탕과 체다치즈를 더해 돌돌 마는 백종원식 또띠아토스트다. 작성자는 집에서 간단한 브런치나 아침 대용으로 먹기 좋은 메뉴로 소개한다.</p><p>팬 하나에서 베이컨·양파를 볶고 달걀을 익힌 뒤 또띠아를 구워 말기만 하면 돼 10분 이내 1인분이 된다. 설탕은 많이 넣으면 달아지니 입맛에 맞게 조절하고, 원하면 케첩을 더한다.</p>
