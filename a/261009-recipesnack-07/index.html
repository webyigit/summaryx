<h1 style="font-size:20px">에그마요 샌드위치 — 딸기잼 한 숟갈의 단짠</h1>
<p>삶은 달걀을 으깨 마요네즈·소금·후추로 버무린 에그마요를 식빵에 듬뿍 올리는 홈브런치 샌드위치다. 작성자는 사 먹는 것보다 맛있고 집에서 쉽게 만들 수 있는 메뉴로 소개한다.</p><p>빵에 딸기잼을 한 숟갈 발라 고소한 에그마요와 단짠 조화를 내는 것이 특징이다. 불을 쓰는 건 달걀 삶기뿐이라 15분이면 충분하고, 랩으로 꽉 감싼 뒤 반으로 자르면 속이 흐트러지지 않아 도시락이나 아침 메뉴로도 좋다.</p>
