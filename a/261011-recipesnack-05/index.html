<h1 style="font-size:20px">백종원 오므라이스 — 루로 만드는 브라운소스와 반숙 달걀</h1>
<p>백종원식 오므라이스 소스를 집에서 만드는 브런치 메뉴다. 식용유와 밀가루를 약불에서 갈색이 돌 때까지 볶아 루를 만들고, 물을 조금씩 풀어 케첩·간장·황설탕·식초·소고기 다시다로 새콤달콤한 브라운소스를 끓인다.</p><p>볶음밥은 양파·당근을 볶다 간장·맛술·후추로 간해 밥을 볶고, 달걀은 스크램블처럼 반숙으로 익혀 밥 둘레에 두른 뒤 소스를 뿌린다. 2인분 30분 이내 초급이다. 영상은 백종원 채널의 오므라이스 소스 쇼츠다.</p>
