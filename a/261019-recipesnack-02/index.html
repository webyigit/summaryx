<h1 style="font-size:20px">백종원 어묵치즈구이 — 어묵 두 장 사이에 김·모차렐라</h1>
<p>마른 팬에 노릇하게 구운 사각어묵 위에 김과 모차렐라 치즈를 올리고 어묵 한 장을 더 덮어 치즈를 녹이는 간식이다. 작성자는 백종원 레시피를 간단히 따라 했다며 간식이나 술안주로 좋다고 소개한다.</p><p>재료가 어묵 2장, 김 반 장, 치즈뿐이라 원문 기준 15분 이내 1인분이다. 치즈가 녹을 때까지 아주 약한 불에 굽고 뚜껑을 덮으면 타지 않고 잘 녹는다. 다 구우면 한입 크기로 잘라 낸다.</p>
