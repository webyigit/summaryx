<h1 style="font-size:20px">에어프라이어 식빵 러스크 — 설탕·기름 넣고 흔들면 끝</h1>
<p>식빵, 설탕, 식용유 세 가지로 만드는 바삭한 러스크다. 작은 조각으로 자른 식빵을 봉지에 넣고 설탕과 기름을 넣어 흔들어 고루 묻힌 뒤 에어프라이어에 굽기만 하면 돼, 식빵팝콘보다도 간단하다는 것이 작성자의 설명이다.</p><p>180도에서 4분 굽고 뒤집어 4분 더 구우면 되고, 전체가 노릇해지도록 조금 더 구워도 좋다. 1인분 10분 이내로 표기돼 있어 남은 식빵을 처리하는 간식으로 알맞다.</p>
