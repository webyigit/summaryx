<h1 style="font-size:20px">방탄소년단 &#x27;Hooligan&#x27; 뮤비 1억 뷰…&#x27;ARIRANG&#x27; 수록곡 세 번째</h1>
<p>방탄소년단의 &#x27;Hooligan&#x27; 뮤직비디오가 14일 오전 6시 41분께 유튜브 조회수 1억 회를 넘었다. &#x27;Hooligan&#x27;은 최신 앨범 &#x27;ARIRANG&#x27;의 수록곡(B사이드)이다.</p><p>이 뮤직비디오는 4월 8일 0시(한국시간) 처음 공개돼 6개월 6일여 만에 1억 뷰에 도달했다.</p><p>&#x27;ARIRANG&#x27; 수록곡 가운데 1억 뷰를 넘긴 뮤직비디오는 &#x27;SWIM&#x27;, &#x27;2.0&#x27;에 이어 &#x27;Hooligan&#x27;이 세 번째다.</p>
