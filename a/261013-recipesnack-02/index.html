<h1 style="font-size:20px">백종원 핫케이크 — 예열 없이 약불에, 흑설탕 &#x27;야매 메이플시럽&#x27;</h1>
<p>집밥백선생식으로 핫케이크 믹스를 표지 사진처럼 매끈하게 굽는 방법이다. 팬에 기름을 살짝 두르고 키친타월로 닦아 낸 뒤 예열 없이 약불에서 반죽을 붓고, 기포가 올라오면 뒤집는다.</p><p>흑설탕과 물을 1:1로 한 번 끓이면 메이플시럽 대용 시럽이 되고, 남은 반죽은 버터 바른 뚝배기에 부어 전자레인지에 4~5분 돌려 &#x27;뚝배기 빵&#x27;으로 만들 수 있다. 10분 안에 끝나는 주말 브런치 간식이다.</p>
