<h1 style="font-size:20px">청담 새벽집 — 24시간 여는 한우 불고기·육회비빔밥</h1>
<p>핫식신의 &#x27;불고기 전골로 유명한 맛집 BEST 5&#x27;에 든 청담동 한우집으로, 연예인들이 자주 찾는 곳으로 소개됐다. 테이블이 나뉘어 있어 프라이빗하게 식사할 수 있다.</p><p>함평·화순 한우를 쓰며, 대표 메뉴 육회비빔밥을 시키면 얼큰한 선지해장국이 함께 나온다. 꽃등심도 인기다.</p><p>가격은 불고기 42,000원, 육회비빔밥 16,000원, 한우갈비탕 28,000원이다. 24시간 연중무휴로 영업한다.</p>
