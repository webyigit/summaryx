<h1 style="font-size:20px">메추리알 장조림: 붓고 끓이기만 하면 되는 밥도둑</h1>
<p>깐 메추리알을 간장·흑설탕·물에 마늘, 다시마, 꽈리고추와 함께 조려 만드는 백종원식 메추리알 장조림이다. 작성자는 밥도둑이 따로 없고 아이들도 좋아하는 간단한 반찬이라고 소개한다.</p><p>깐 메추리알을 쓰면 껍질 벗기는 수고가 없고, 냄비에 재료를 차례로 붓고 3~5분 끓이면 끝이다. 처음엔 싱거워도 식으면서 간이 배니 간장을 더 넣지 말라는 팁이 있고, 6인분 이상 넉넉히 만들어 냉장고에 두고 일주일 안에 먹으면 된다.</p>
