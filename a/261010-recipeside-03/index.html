<h1 style="font-size:20px">백종원 콩나물무침 — 5분 삶아 헹구고 국간장으로 간</h1>
<p>&#x27;국민 밑반찬&#x27; 콩나물무침을 백종원식으로 만드는 레시피다. 콩나물을 물 자작하게 붓고 5분 정도 삶되 뚜껑은 처음부터 끝까지 열어 두거나 닫아 두는 것이 비린내를 피하는 요령이다.</p><p>삶은 콩나물을 찬물에 헹궈 아삭함을 살린 뒤 고춧가루·국간장·마늘·대파로 무치고 참기름으로 마무리한다. 작성자는 반찬통에 담아 두었다가 김치·채소·달걀프라이를 곁들여 비빔밥으로 먹는 방법도 소개한다. 15분이면 3인분이 완성된다.</p>
