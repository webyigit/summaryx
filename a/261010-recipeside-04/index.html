<h1 style="font-size:20px">백종원 가지볶음 — 파기름에 간장·설탕, 5분 반찬</h1>
<p>가지 두 개로 5분 만에 끝내는 백종원식 가지볶음이다. 먼저 파를 기름에 볶아 향을 낸 뒤 반 갈라 썬 가지를 넣어 볶고, 간장과 설탕만으로 간을 하는 아주 단순한 구성이다.</p><p>간장 대신 액젓을 써도 되는데, 이때는 반 큰술부터 넣고 맛을 보며 조금씩 늘리라는 팁이 붙어 있다. 설탕을 넣은 뒤에는 빠르게 볶아 가지가 물러지지 않게 마무리하면 된다. 제철 가지로 바로 만들 수 있는 초간단 밥반찬이다.</p>
