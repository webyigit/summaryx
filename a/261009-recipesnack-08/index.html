<h1 style="font-size:20px">에어프라이어 웨지감자 — 감자·올리브오일·소금이면 끝</h1>
<p>감자를 반달 모양 웨지로 썰어 올리브오일과 소금, 파슬리에 버무린 뒤 에어프라이어에 굽는 간단한 감자 간식이다. 껍질째 써도 돼 손질이 빠르고, 맥주 안주나 파티 곁들임으로도 어울린다.</p><p>썬 감자를 찬물에 10분쯤 담가 표면 전분을 빼고 물기를 꼼꼼히 닦는 것이 바삭함의 비결이다. 재료는 감자 4개와 양념 세 가지뿐이고, 190도에서 15~18분 중간에 한 번 뒤집어 주면 된다. 감자 두께와 기기에 따라 시간은 조절한다.</p>
