<h1 style="font-size:20px">백종원 만능간장 꽈리고추조림 — 간장 1.5국자·물 2국자</h1>
<p>미리 만들어 둔 백종원 만능간장으로 꽈리고추와 청양고추를 졸여 내는 밑반찬이다. 재료가 꽈리고추·청양고추·만능간장·물 네 가지뿐이라 원문 기준 10분 이내에 끝난다.</p><p>냄비에 고추를 넣고 만능간장 1.5국자와 물 2국자를 부어 졸이다가, 싱거우면 간장을, 짜면 물을 더해 간을 맞추면 된다. 후기에서는 간이 잘 배고 아주 쉽다는 반응이 많았다. 만능간장이 없다면 먼저 만들어 두어야 한다.</p>
