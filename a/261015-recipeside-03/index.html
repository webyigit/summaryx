<h1 style="font-size:20px">백종원 냉이된장국 — 쌀뜨물에 간 멸치 넣어 한소끔</h1>
<p>쌀뜨물에 된장을 풀어 끓이다가 믹서에 곱게 간 멸치와 다진마늘을 넣고, 냉이·두부·파를 더해 한 번 끓여 내는 된장국이다. 작성자는 &#x27;집밥 백선생2&#x27;를 보고 따라 했다며 이 레시피를 소개한다.</p><p>멸치를 갈아 넣어 육수를 따로 우리지 않아도 되고, 재료가 들어간 뒤 한 번만 팔팔 끓이면 돼 30분 안에 4인분이 된다. 냉이는 꼭지를 다듬어 찬물에 10분 담갔다가 흐르는 물에 씻는다. 두부는 빼도 맛있다고 한다.</p>
