<h1 style="font-size:20px">성북구 청년밥상문간 — 청년을 위한 4,000원 김치찌개</h1>
<p>핫식신이 KBS &#x27;한국인의 밥상&#x27;에서 찾아낸 서울 노포 맛집 5곳으로 소개한 곳이다.</p><p>사회적협동조합이 청년들에게 값싼 한 끼를 대접하려고 운영하는 비영리 식당이다. 두부와 고기가 넉넉히 든 김치찌개가 대표다.</p><p>라면사리를 더하면 든든한 한 끼가 된다. 가격은 김치찌개 1인분 4,000원, 라면사리 1,000원이다. 11시~20시 30분 영업(14시 30분~17시 쉬는 시간), 일요일은 휴무다.</p>
