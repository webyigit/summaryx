<h1 style="font-size:20px">백종원 콩나물찌개 — 파기름·고춧가루로 끓이는 해장 찌개</h1>
<p>파기름에 돼지고기를 볶고 고춧가루를 넣은 뒤 콩나물을 넣어 끓이는 백종원식 콩나물찌개다. 작성자는 반찬이 없을 때, 특히 해장용으로 좋다고 소개한다.</p><p>양념은 새우젓·간장·다진 마늘 각 1큰술 정도로 단순하지만 맛이 좋다고 하고, 원문 표기로 15분 이내 4인분이 된다. 고춧가루는 타기 쉬워 빠르게 볶아야 한다. 후기 78건에선 간단하고 밥 말아 먹기 좋다는 평이 많고, 새우젓이 없으면 액젓·국간장·소금으로 대신했다는 의견이 있다.</p>
