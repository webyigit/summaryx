<h1 style="font-size:20px">안성 약수터식당 — 소·돼지 곱창 골라 먹는 양성면 곱창전골</h1>
<p>핫식신의 &#x27;줄 서서 먹는 곱창전골 맛집 5곳&#x27;에 경기도에서 유일하게 오른 안성 양성면의 식당이다.</p><p>소곱창과 돼지곱창 전골을 모두 내 취향대로 고를 수 있다. 소곱창은 호주산, 돼지곱창은 국내산이며, 떡·칼국수 사리·버섯·대파 등을 넣어 끓여 먹는다. 소머리국밥도 함께 판다.</p><p>가격은 소곱창전골(소) 38,000원, 소머리국밥 10,000원이다. 영업은 매일 9시~21시이고 월요일은 쉰다.</p>
