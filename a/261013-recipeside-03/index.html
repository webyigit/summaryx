<h1 style="font-size:20px">백종원 시금치된장국 — 쌀뜨물에 된장 두 가지 풀어 끓이는 아침국</h1>
<p>쌀뜨물에 집된장과 시판된장을 섞어 풀고 시금치 한 단을 넣어 끓이는 구수한 아침국이다. 고춧가루 1t와 간마늘로 맛을 더하고 소금으로 간을 맞춘다.</p><p>쌀은 세 번쯤 씻은 뒤 나오는 물을 쓰면 되고, 국물이 끓을 때 시금치를 넣어 한소끔 끓이면 끝이라 20분 안에 4인분이 나온다. 집된장의 깊은 맛과 시판된장의 단맛을 섞어 달큰하고 구수한 맛을 낸다는 점이 이 레시피의 요령이다.</p>
