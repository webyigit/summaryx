<h1 style="font-size:20px">성북동 선동보리밥 — 1988년부터 이어 온 나물 듬뿍 보리밥</h1>
<p>핫식신이 &#x27;고즈넉한 골목에서 즐기는 여유&#x27;를 주제로 고른 성북동 인기 맛집 5곳 가운데 하나다.</p><p>1988년부터 영업해 온 동네 터줏대감 식당이다. 보리밥에 여러 가지 제철 나물과 깍두기, 된장찌개가 함께 나오고, 장독대에서 꺼낸 직접 담근 고추장을 넣어 비벼 먹는다.</p><p>가격은 보리밥 12,000원, 감자전 19,000원, 낙지볶음 22,000원이다. 영업은 10시 30분~20시 30분, 월요일은 쉰다.</p>
