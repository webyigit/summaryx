<h1 style="font-size:20px">단짠 멸치볶음: 견과류 넣어 고소한 국민 밑반찬</h1>
<p>백종원 레시피를 바탕으로 간장과 올리고당으로 단짠 맛을 낸 멸치볶음이다. 견과류와 청양고추를 더해 바삭하고 고소하면서도 살짝 칼칼한 맛을 냈다.</p><p>멸치를 마른 팬에 먼저 볶아 비린 맛과 가루를 털어 내는 것이 핵심이고, 이후엔 기름에 볶다 양념만 넣으면 된다. 원문 댓글에서 물 3큰술을 넣으니 눅눅해졌다는 의견이 있어 작성자도 물을 줄이길 권했다. 4인분 넉넉한 양이라 두고 먹기 좋다.</p>
