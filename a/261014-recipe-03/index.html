<h1 style="font-size:20px">백종원 간장계란밥 — 파기름에 달걀 볶고 간장 눌려 볶는 볶음밥</h1>
<p>파를 넉넉히 볶아 파기름을 내고 달걀을 스크램블한 뒤 간장으로 간을 해 밥과 볶는 중화요리집 스타일 볶음밥이다. 작성자는 입맛 없거나 급히 한 끼를 챙길 때 만들던 추억의 간장계란밥을 백종원 방식으로 볶아 풍미를 살렸다고 소개한다.</p><p>재료는 달걀·밥·파·간장·식용유·소금이 전부이고 팬 하나로 20분 안에 2인분을 만든다. 간장을 팬 한쪽에서 먼저 지글지글 끓인 뒤 섞는 것과 달걀을 완전히 익히지 않는 것이 포인트다.</p>
