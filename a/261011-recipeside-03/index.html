<h1 style="font-size:20px">백종원 깻잎무침 — 끓이지 않고 켜켜이 바르는 양념장</h1>
<p>불을 쓰지 않고 양념장만 만들어 깻잎에 켜켜이 바르는 백종원식 깻잎무침이다. 진간장·멸치액젓·설탕·고춧가루·간 마늘·물에 양파·당근·대파·고추를 채 썰어 섞어 양념 속을 만든다.</p><p>채소에서 물이 나와 양념이 배면 반찬통에 양념을 조금 깔고 깻잎과 번갈아 쌓기만 하면 된다. 바로 먹을 땐 참기름을 넣어도 되지만 오래 둘 반찬이면 참기름을 빼라고 원문은 권한다. 30분 이내, 난이도 &#x27;아무나&#x27;.</p>
