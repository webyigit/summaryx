<h1 style="font-size:20px">백파더 꼬마김밥 — 참치마요를 깻잎에 싸서 한입 크기로</h1>
<p>백파더(백종원)식 꼬마김밥으로, 기름 뺀 참치에 다진 단무지·대파 흰 부분을 넣고 마요네즈·설탕으로 버무린 속을 깻잎에 싸서 4등분한 김에 마는 간식이다.</p><p>칼질할 재료가 거의 없고 불을 쓰지 않아 15분이면 2인분이 완성된다. 마요네즈는 한 번에 넣지 말고 조금씩 넣으며 비율을 맞추라는 것이 작성자의 팁이며, 깻잎이 없으면 김밥용 김만으로 싸도 된다. 단무지가 아삭한 식감을 더한다.</p>
