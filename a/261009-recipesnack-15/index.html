<h1 style="font-size:20px">에어프라이어 치즈뻥 — 슬라이스 치즈 한 장이 과자로</h1>
<p>슬라이스 치즈만 있으면 만드는 바삭한 치즈 과자다. 포장째 칼등으로 치즈를 조각내 에어프라이어에 간격을 두고 올린 뒤 굽기만 하면, 치즈가 부풀어 오르며 과자처럼 바삭해진다.</p><p>재료가 치즈 한 가지이고 195도에서 5분이면 완성돼, 작성자는 아이 간식으로 아주 쉬운 메뉴라고 소개한다. 굽는 동안 크게 부풀기 때문에 간격을 넉넉히 두는 것만 주의하면 된다.</p>
