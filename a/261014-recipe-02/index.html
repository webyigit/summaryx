<h1 style="font-size:20px">들기름막국수 — 메밀면 삶는 동안 양념장만 섞으면 완성</h1>
<p>메밀면을 삶아 들기름·진간장 양념에 버무리고 쪽파·김·달걀노른자를 올리는 비빔 메밀국수다. 작성자는 더위에 약해 쉽고 간단한 요리를 찾다가 만들었다며, 들기름의 고소한 향이 맛을 완성한다고 설명한다.</p><p>면이 삶아지는 약 8분 동안 쪽파를 썰고 양념을 섞으면 되므로 15분 안에 끝난다. 끓어오를 때 찬물을 한 번 부어 다시 끓이면 면이 쫄깃해진다는 팁이 있고, 매실액 대신 설탕을 써도 된다.</p>
