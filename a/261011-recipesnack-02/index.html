<h1 style="font-size:20px">골목식당 부추전 — 마른 새우·청양고추로 10분 전</h1>
<p>&#x27;백종원의 골목식당&#x27;에 나온 부추전을 따라 만든 레시피다. 부추에 마른 새우와 청양고추를 넣어 감칠맛과 칼칼함을 더하고, 부침가루와 물을 1:1로 맞춰 반죽한다.</p><p>반죽 농도는 가루와 물을 나눠 넣으며 맞추고, 기름을 넉넉히 두른 팬에 부쳐 겉을 바삭하게 하는 것이 요령이다. 2인분 10분 이내, 난이도 &#x27;아무나&#x27;로 비 오는 날 간식이나 막걸리 안주로 빠르게 낼 수 있다.</p>
