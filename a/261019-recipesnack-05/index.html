<h1 style="font-size:20px">식빵 치즈스틱 — 밀대로 민 식빵에 말아 팬에 굴려 굽기</h1>
<p>테두리를 자르고 밀대로 얇게 민 식빵에 스틱치즈를 올려 돌돌 말고, 계란물과 빵가루를 입혀 팬에 굴려 가며 노릇하게 굽는 치즈스틱이다. 작성자는 맥주 안주나 아이 간식으로 좋다고 소개한다.</p><p>재료가 식빵·스틱치즈·계란·빵가루 네 가지뿐이고 튀기지 않고 팬에 굴려 구우면 돼 손이 덜 간다. 겉은 바삭하고 속 치즈는 부드러우며, 작성자는 머스타드 소스에 찍어 먹기를 추천한다. 원문에는 조리 시간·인분·분량 표기가 없다.</p>
