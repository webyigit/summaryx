<h1 style="font-size:20px">백종원식 감자조림 — 당근·양파 더한 짭조름한 밑반찬</h1>
<p>백종원 레시피를 응용해 당근과 양파를 더한 짭조름한 감자조림이다. 감자를 깍둑 썰어 찬물에 10분 담가 텁텁함을 줄이고 눌어붙지 않게 한 다음, 채소와 함께 볶다가 간장 양념에 졸이는 방식이다.</p><p>양념은 진간장·올리고당·설탕·미림에 물 한 컵이면 되고, 뚜껑을 덮어 중약불에서 졸이다 국물이 자작해지면 부추와 통깨로 마무리한다. 4인분 30분 이내로 넉넉히 만들어 두고 먹는 밑반찬이다.</p>
