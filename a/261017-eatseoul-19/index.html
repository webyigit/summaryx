<h1 style="font-size:20px">송파 봉피양 — 벽제갈비가 운영하는 평양냉면</h1>
<p>핫식신이 KBS &#x27;한국인의 밥상&#x27;에서 찾아낸 서울 노포 맛집 5곳으로 소개한 곳이다.</p><p>벽제갈비가 운영하는 돼지갈비·평양냉면집이다. 순도 높은 메밀면과 진한 소고기 육수의 평양냉면이 대표로, 추운 날에도 대기 줄이 생긴다고 한다.</p><p>원문은 송파 일대에서 가장 잘 알려진 평양냉면집 가운데 하나로 소개했다. 가격은 평양냉면 16,000원, 한우양곰탕 21,000원이며 매일 11시 30분~22시 영업한다.</p>
