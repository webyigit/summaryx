<h1 style="font-size:20px">을지로 대성골뱅이 — 큰 천막 아래 붐비는 골뱅이 야장</h1>
<p>핫식신의 &#x27;야장 맛집 BEST 5&#x27;에 든 을지로 골뱅이집으로, 큰 천막 아래에 손님이 많이 모이는 곳이다.</p><p>대표 메뉴 골뱅이는 새콤달콤한 양념에 대파·오이·북어채를 넣어 무치며 소면을 추가해 먹기를 권했다. 식신 이용자 후기에는 매우 붐비고, 골뱅이·계란말이·먹태를 시키면 좋다는 평이 실렸다.</p><p>가격은 골뱅이(소) 23,000원, 순살마늘치킨 23,000원, 먹태 16,000원이다. 오후 2시부터 새벽 2시까지 열고 일요일은 쉰다.</p>
