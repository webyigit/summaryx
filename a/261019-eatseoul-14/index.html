<h1 style="font-size:20px">종로 선비옥 — 탑골공원 뒤 돌담길 야장의 육회·돼지갈비</h1>
<p>핫식신이 &#x27;지금 아니면 못 가는 야장 맛집 BEST 5&#x27;로 꼽은 종로 관수동 식당이다. 탑골공원 뒤편 돌담길로 옮겨 더 쾌적해졌다고 소개됐다.</p><p>바깥 자리에서 돼지갈비와 냉면을 먹을 수 있고, 도축장에서 바로 받아 오는 고기를 써 육회와 사시미가 별미로 꼽혔다. 선선한 가을에 야외에서 한잔하기 좋은 곳으로 묶였다.</p><p>가격은 육회+사시미 43,000원, 국산수제돼지갈비 20,000원이며 매일 11시부터 23시까지 연다.</p>
