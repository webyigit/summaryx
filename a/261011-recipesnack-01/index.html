<h1 style="font-size:20px">백종원 라볶이 — 설탕 먼저 넣고 라면 반 갈라 넣기</h1>
<p>떡볶이 떡·어묵·라면 한 봉지로 만드는 백종원식 라볶이다. 물 2컵에 떡과 어묵을 넣고 설탕을 가장 먼저 넣은 뒤, 끓기 시작하면 고추장·고춧가루·간장을 더하는 순서가 포인트다.</p><p>라면을 반으로 갈라 넣고 면이 익으면 대파를 넣어 한소끔 끓이면 완성으로, 2인분 30분 이내 간식이다. 원문 후기에는 물을 3컵으로 늘리거나 설탕을 줄였다는 의견이 많아 입맛에 맞게 조절하면 된다. 영상은 이 레시피를 소개한 레시피라운지 채널 영상이다.</p>
