<h1 style="font-size:20px">11월이 오로라 적기, 개썰매와 얼음낚시…캐나다 유콘</h1>
<p>론리플래닛은 11월 가볼 만한 여행지로 캐나다 북서부 유콘을 꼽으며 &#x27;겨울 왕국과 오로라&#x27;에 가장 좋은 곳이라고 소개했다. 11월은 북극광을 보기 좋은 대표 시기다.</p><p>기온은 영하 1도에서 영하 15도 사이다. 반나절 개썰매 체험부터 여러 날 동안 직접 썰매를 모는 장거리 프로그램까지 고를 수 있고, 스키·설피 하이킹·얼음낚시도 즐길 수 있다.</p><p>프로그램 요금과 가는 방법은 글에 나오지 않으므로 현지 업체에서 확인해야 한다.</p>
