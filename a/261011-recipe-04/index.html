<h1 style="font-size:20px">백종원 소불고기 — 설탕부터 버무리는 간장 불고기</h1>
<p>백종원 방식의 간장 소불고기 레시피다. 보통은 양념을 한 번에 섞지만, 여기서는 소고기에 설탕을 먼저 버무리고 물엿을 더한 뒤 간장·간 양파·마늘·후추·참기름을 넣는 순서로 단맛을 고기에 먼저 배게 한다.</p><p>20~30분 재우는 동안 양파·파프리카·버섯·대파를 채 썰어 두었다가 함께 버무려 기름 두른 팬에 볶으면 된다. 원문은 60분 이내로 표기했지만 대부분이 재우는 시간이고, 삶은 당면을 넣으면 잡채처럼 즐길 수도 있다.</p>
