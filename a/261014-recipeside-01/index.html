<h1 style="font-size:20px">백종원 숙주나물무침 — 2~3분 데쳐 간장·소금·참기름</h1>
<p>숙주를 소금물에 짧게 데쳐 간장·소금·참기름·파로 무치는 기본 나물 반찬이다. 작성자는 아삭한 식감을 살린 숙주나물무침을 아이 반찬과 도시락·자취생 밑반찬으로 추천한다.</p><p>숙주 한 봉지에 양념 몇 가지만 있으면 되고 데치기 2~3분, 무치기까지 15분이면 4인분이 완성된다. 데친 뒤 찬물에 헹궈 물기를 꽉 짜야 양념이 겉돌지 않는다.</p>
