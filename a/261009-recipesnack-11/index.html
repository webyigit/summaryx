<h1 style="font-size:20px">에어프라이어 마늘빵 — 연유 한 숟갈로 단짠 간식</h1>
<p>식빵에 버터·다진 마늘·연유·파슬리를 섞은 소스를 발라 에어프라이어로 굽는 마늘빵이다. 버터의 풍미와 마늘 향에 연유가 단맛을 더해 균형을 잡아 주며, 간식은 물론 파스타나 수프 곁들이로도 좋다고 소개한다.</p><p>소스를 두껍게 바르면 촉촉하고 얇게 바르면 바삭해 취향대로 조절할 수 있다. 180도에서 8~10분이면 되고, 길쭉하게 잘라 구우면 가장자리까지 바삭해진다. 2인분 20분 이내로 표기돼 있다.</p>
