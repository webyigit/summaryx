<h1 style="font-size:20px">에어프라이어 감자고로케 — 떡뻥 빵가루 아이 간식</h1>
<p>삶은 감자에 버터·다진 채소·아기치즈를 섞어 동그랗게 빚고, 부순 떡뻥을 빵가루 삼아 묻혀 에어프라이어로 굽는 감자고로케다. 작성자는 유아식 반찬·간식으로 만들었지만 어른도 맛있게 먹는다고 소개한다.</p><p>튀기지 않고 에어프라이어 160도에서 13분 정도 구우면 돼 20분 안에 끝나고 기름 부담도 적다. 반죽 절반에 고구마를 섞으면 단맛이 더해지는데, 작성자 집 아이들은 고구마 버전을 가장 좋아했다고 한다. 떡뻥 대신 일반 빵가루를 써도 된다.</p>
