<h1 style="font-size:20px">백종원 북엇국 — 참기름에 볶은 황태와 쌀뜨물로 15분</h1>
<p>&#x27;집밥 백선생&#x27; 방식의 북엇국 레시피다. 황태채를 물에 불린 뒤 참기름을 넉넉히 두른 냄비에 충분히 볶아 고소한 맛을 끌어내는 것이 핵심이다.</p><p>쌀뜨물 600ml와 황태 불린 물 300ml를 붓고 다진 마늘·국간장·새우젓·소금으로 간한 뒤, 끓으면 청양고추와 풀어 둔 달걀을 넣고 대파로 마무리한다. 15분 이내 초급 국으로 해장국이나 아침국으로 좋다.</p>
