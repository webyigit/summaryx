<h1 style="font-size:20px">안양 할아버지 참나무 장작구이 — 푸드트럭에서 시작한 한 가지 메뉴 장작구이 통닭</h1>
<p>핫식신이 고른 전국 장작구이 통닭 맛집 5곳 가운데 경기도에서 꼽힌 안양동의 통닭집이다.</p><p>주인이 오래 푸드트럭을 운영하며 단골을 모은 뒤 가게를 열었다. 가게 밖에 참나무 장작을 쌓아 두고 굽는데, 메뉴는 통닭 한 마리 하나뿐이며 껍질이 바삭하고 속살은 부드럽다는 평이다.</p><p>가격은 장작구이통닭 19,000원(매장), 18,000원(포장)이다. 영업은 매일 13시 30분~20시이고 수요일은 쉰다.</p>
