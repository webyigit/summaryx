<h1 style="font-size:20px">백종원 꽈리고추멸치볶음 — 포크로 찔러 간 배게, 멸치는 마른 팬에</h1>
<p>꽈리고추와 볶음 멸치를 간장·설탕·맛술·올리고당 양념에 볶는 밑반찬이다. 멸치는 마른 팬에 먼저 볶아 비린내를 날리고 덜어 두었다가, 마늘과 꽈리고추를 양념에 볶은 뒤 마지막에 합친다.</p><p>꽈리고추를 포크로 여러 군데 찔러 두면 양념이 빨리 배어 조리 시간이 줄어든다는 것이 핵심 팁이다. 고소한 멸치와 살짝 매콤한 꽈리고추가 어우러지고, 15분 안에 4인분을 만들어 두고 먹을 수 있다.</p>
