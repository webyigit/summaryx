<h1 style="font-size:20px">백종원 간장비빔국수 — 간장·설탕·참기름 2:1:1이면 끝</h1>
<p>소면을 삶아 찬물에 식힌 뒤 간장·설탕·참기름 양념에 비벼 먹는 1인분 국수다. 작성자는 혼자 사는 사람이 먹기 알맞은 양과 간편한 방법을 소개한다며, 입맛 없을 때 가볍게 먹기 좋은 메뉴로 올렸다.</p><p>양념은 간장 2 : 설탕 1 : 참기름 1 비율만 기억하면 되고, 재료도 소면과 기본 양념 몇 가지뿐이라 10분 이내에 완성된다. 김이나 집에 있는 채소를 고명으로 얹어 변화를 줄 수 있다.</p>
