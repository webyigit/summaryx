<p>참치·크래미·삶은 계란과 양파·당근·피클을 잘게 다져 마요네즈·머스터드·식초·설탕 소스에 버무린 속을 버터에 구운 식빵 사이에 넣는 샌드위치다.</p><p>재료를 다져 한 볼에 비비기만 하면 속이 완성돼 주말 브런치나 도시락으로 좋다. 마요네즈는 두 바퀴, 머스터드는 한 바퀴 두른 뒤 맛을 보며 더하라는 것이 작성자의 팁이다. 랩으로 싸서 잠시 두었다 썰면 모양이 잘 잡힌다.</p>
