<h1 style="font-size:20px">블랙핑크 리사, 솔로 EP &#x27;PRESS PLAY&#x27; 트랙리스트 공개…10월 23일 발매</h1>
<p>블랙핑크 리사가 솔로 EP &#x27;PRESS PLAY&#x27;의 트랙리스트를 공개했다. EP는 10월 23일 발매될 예정이며, 트랙리스트는 이미지 형태로 공개됐다.</p><p>리사는 지난 9월 선공개 싱글 &#x27;SaWaDiKa&#x27;로 솔로 컴백을 알렸다. &#x27;SaWaDiKa&#x27; 뮤직비디오는 올해 가장 빠르게 유튜브 1억 뷰를 넘긴 뮤직비디오이자, 2026년 K팝 아티스트 뮤직비디오 가운데 처음으로 2억 뷰를 달성한 영상이 됐다.</p>
