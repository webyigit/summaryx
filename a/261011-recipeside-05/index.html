<h1 style="font-size:20px">백종원 애호박전 — 보리새우 가루와 전분으로 얇게</h1>
<p>애호박을 동그랗게 썰지 않고 채 썰어 전분으로 얇게 부치는 백종원식 애호박전이다. 마른 팬에 볶아 비린내를 날린 보리새우를 곱게 갈아 넣어 감칠맛을 더한다.</p><p>채 썬 애호박에 소금을 뿌리고, 새우 가루 1큰술·전분·청양고추를 섞어 기름 두른 팬에 얇게 펴 앞뒤로 노릇하게 부친다. 기름이 많거나 너무 일찍 뒤집으면 질척해지니 가장자리부터 조심히 뒤집으라는 팁이 있다. 15분 이내 초급 반찬이다.</p>
