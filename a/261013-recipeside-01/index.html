<h1 style="font-size:20px">백종원 표고버섯볶음 — 데쳐서 물기 짜고 굴소스로 10분</h1>
<p>생표고버섯을 2분 데쳐 물기를 꼭 짠 뒤 대파·양파·청양고추와 볶고 굴소스와 참기름으로 맛을 내는 밑반찬이다. 데친 물과 잘라 낸 밑둥은 버리지 않고 육수나 된장국에 쓰면 된다.</p><p>데친 뒤 물기를 빼 두면 냉장 보관해도 물이 생기지 않고, 썬 버섯에 소금으로 밑간을 해 두면 양념과 따로 놀지 않는다는 것이 작성자의 팁이다. 굴소스 한 큰술로 감칠맛을 내 10분 안에 끝나는 쫄깃한 반찬이다.</p>
