<h1 style="font-size:20px">맹금류 약 200만 마리가 지나가는 하늘…파나마 소베라니아 국립공원 탐조</h1>
<p>론리플래닛은 11월 여행지로 파나마를 꼽으며 &#x27;탐조에 가장 좋은 곳&#x27;이라고 소개했다. 10~11월에는 이동하는 맹금류와 칠면조독수리 약 200만 마리가 파나마 상공을 지나간다.</p><p>새뿐 아니라 나무늘보, 고함원숭이, 개구리 같은 열대 동물도 함께 만날 수 있다. 론리플래닛은 이들을 찾아보기에 훌륭한 장소로 소베라니아 국립공원을 추천했다.</p><p>가는 방법·가이드 투어·요금은 글에 나오지 않아 따로 확인해야 한다.</p>
