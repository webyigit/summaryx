<h1 style="font-size:20px">백종원식 고추장찌개 — 고추기름부터 내는 얼큰한 찌개</h1>
<p>얼큰한 국물이 생각날 때 쉽게 끓일 수 있다고 소개하는 백종원식 고추장찌개다. 식용유·참기름에 고추장과 고춧가루를 약불로 볶아 고추기름을 먼저 낸 뒤 물을 붓는 것이 핵심으로, 육수 없이도 국물 맛이 진해진다.</p><p>감자와 돼지고기를 먼저 넣어 익히고, 다시 끓어오르면 마늘·국간장·액젓으로 간한 뒤 양파·버섯, 마지막에 대파·고추를 넣으면 완성이다. 4인분 기준 30분 이내로 표기돼 있어 밥 한 그릇과 곁들이는 메인 찌개로 알맞다.</p>
