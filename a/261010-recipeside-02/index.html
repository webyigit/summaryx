<h1 style="font-size:20px">백종원 오이무침 — 소금물에 10분 절여 고추장으로 마무리</h1>
<p>오이를 소금물에 짧게 절여 고추장 양념에 무치는 백종원식 오이무침이다. 굵은소금 한 큰술과 물 반 컵으로 10분 정도, 2분마다 뒤집어 가며 절이면 오이가 고르게 절여져 아삭하면서 물이 덜 생긴다.</p><p>양념은 고춧가루·간장·설탕·마늘을 먼저 넣고 고추장을 마지막에 넣어 버무리는 순서이며, 새콤한 맛을 원하면 식초 한 큰술을 더한다. 양파나 부추를 넣어도 맛있다는 팁이 있어 여름·가을 즉석 반찬으로 15분이면 충분하다.</p>
