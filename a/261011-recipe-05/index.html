<h1 style="font-size:20px">백종원 알리오올리오 — 마늘·페페론치노·면수로 15분 파스타</h1>
<p>올리브유에 편마늘·다진 마늘·페페론치노만 볶아 면과 버무리는 백종원식 알리오올리오다. 재료가 단출하고 15분 이내에 끝나 혼밥 파스타로 손쉽다.</p><p>소금 1큰술 넣은 물에 스파게티를 7~8분 삶는 동안 팬에 마늘 오일을 내고, 마늘이 타지 않게 불을 줄였다가 면과 면수 두 국자를 넣어 섞으며 소금으로 간한다. 면수가 소스를 유화시키는 역할을 한다. 영상은 백종원 채널의 &#x27;K-알리오올리오&#x27; 편이다.</p>
