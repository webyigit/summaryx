<h1 style="font-size:20px">백종원 오이소박이 국수말이 — 소박이 넣은 새콤 냉국수</h1>
<p>냉수에 고춧가루·설탕·다진마늘·국간장·식초·참치액을 녹여 국물을 만들고, 썬 오이소박이와 청양고추를 담가 차게 둔 뒤 소면에 부어 먹는 여름 국수다. 작성자는 시원하고 아삭하며 매콤칼칼한 맛이라고 소개한다.</p><p>국물을 미리 만들어 냉장고에 넣어 두면 먹기 직전에 소면만 삶아 말면 돼 30분 안에 3인분을 낼 수 있다. 소면은 끓어오를 때 찬물을 두 번 붓고 세 번째 끓으면 건져 여러 번 헹군다. 익은 오이소박이를 활용하기 좋은 메뉴다.</p>
