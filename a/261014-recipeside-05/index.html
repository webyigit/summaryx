<h1 style="font-size:20px">백종원 부추 달걀 볶음 — 굴소스 한 숟갈, 덮밥으로도</h1>
<p>부드럽게 스크램블한 달걀에 부추와 굴소스를 넣어 볶는 간단 반찬이다. 작성자는 반찬이 없을 때 바로 해 먹을 수 있는 메뉴로 소개하고, 따로 반찬으로 먹어도 좋지만 밥 위에 올려 덮밥으로도 즐겼다.</p><p>부추 한 줌과 달걀 4개, 굴소스·참기름만 있으면 15분 이내에 2인분이 된다. 기름이 뜨거울 때 달걀을 붓고 빠르게 저어야 부드러운 스크램블이 된다는 팁이 있다.</p>
