<h1 style="font-size:20px">백종원 짜장덮밥 — 짜장 분말 한 봉지로 20분 한 그릇</h1>
<p>시판 짜장 분말가루 한 봉지로 만드는 짜장덮밥이다. 돼지고기와 양파·애호박·새송이버섯을 기름에 볶다가 물 2컵을 붓고 분말을 풀어 끓이면 소스가 완성돼, 춘장을 따로 볶는 수고가 없다.</p><p>조리 시간은 20분 이내, 난이도는 &#x27;아무나&#x27;로 표기돼 자취생 점심·저녁 메뉴로 소개됐다. 분말이 뭉치거나 눌어붙지 않도록 약불에서 계속 저어 주는 것이 유일한 요령이고, 밥 위에 부으면 바로 한 그릇 요리가 된다.</p>
