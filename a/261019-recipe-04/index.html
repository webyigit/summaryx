<h1 style="font-size:20px">백종원 크림파스타 — 우유 300ml에 밀가루로 농도 맞추기</h1>
<p>올리브유에 마늘·베이컨·양파를 볶고 버터와 우유를 부어 삶은 면과 졸이는 1인분 크림파스타다. 생크림 대신 우유를 쓰고 밀가루 1/2T로 농도를 맞추는 백종원 레시피를 활용했다고 작성자는 밝힌다.</p><p>면을 7분 삶는 동안 재료를 볶고, 우유를 붓고 졸인 뒤 간은 면수나 치킨스톡으로 맞추면 돼 원문 기준 30분 이내다. 베트남 고추를 넣어 느끼함을 덜고, 원래 레시피의 파마산치즈 대신 작성자는 체다치즈를 넣었다.</p>
