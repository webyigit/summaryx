<h1 style="font-size:20px">백종원식 두부조림 — 나홀로 이식당에서 소개된 간장 두부조림</h1>
<p>예능 &#x27;나홀로 이식당&#x27;에서 반찬이 모자라 백종원에게 급히 물어 만들었다는 두부조림을 만개의레시피가 정리한 레시피다. 두부를 기름에 앞뒤로 지지듯 익힌 뒤 간장 양념장을 부어 졸이는 4단계로 끝난다.</p><p>양념장은 간장 7숟가락에 설탕·맛술·다진 마늘·고춧가루·참기름을 섞고, 양파·대파·청양고추를 넣어 매콤함을 더한다. 2인분 30분 이내, 초급 난이도로 두부 한 모만 있으면 되는 기본 밥반찬이다.</p>
