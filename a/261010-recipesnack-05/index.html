<h1 style="font-size:20px">백종원 토마토달걀볶음 — 굴소스로 맛내는 15분 아침</h1>
<p>토마토달걀볶음을 백종원 방식으로 만든 레시피다. 달걀을 먼저 스크램블해 덜어 두고, 파기름에 토마토를 볶아 간장·굴소스로 간한 뒤 다시 합치는 순서라 달걀이 질겨지지 않는다.</p><p>작성자는 바쁜 아침에 간단히 먹을 수 있고 자극적이지 않은 메뉴라고 소개한다. 토마토 3개와 달걀 4개면 15분 안에 4인분이 된다. 큰 토마토는 칼집을 내 살짝 데쳐 껍질을 벗기면 식감이 부드러워진다.</p>
