<h1 style="font-size:20px">우삼겹 덮밥(규동) — 기름 닦아내고 간장 양념 2분</h1>
<p>우삼겹을 양파와 볶은 뒤 설탕·맛술·올리고당·간장·다진마늘 양념으로 달콤짭짤하게 볶아 밥 위에 올리는 규동 스타일 덮밥이다. 작성자는 덮밥으로도, 반찬으로도 먹기 좋은 간단한 한 끼로 소개한다.</p><p>고기와 양파를 볶은 뒤 키친타월로 기름을 닦아내고 양념을 넣어 2분만 볶으면 돼 20분 안에 1인분이 완성된다. 고춧가루·청양고추·페페론치노로 매운맛을 더하거나 달걀프라이·노른자를 올려도 좋다고 한다.</p>
