<h1 style="font-size:20px">백종원 제육덮밥 — 고기에 설탕 먼저, 채소는 센불에 빠르게</h1>
<p>삼겹살로 만드는 백종원식 제육덮밥이다. 고기를 4×1cm로 썰어 겉이 하얗게 익을 때까지 볶은 다음 설탕을 먼저 넣어 단맛을 입히고, 간장·고춧가루·다진 마늘로 양념하는 순서가 핵심이다.</p><p>양파·양배추·대파·당근·고추를 한데 섞어 두었다가 센불에 넣어 반쯤만 익혀 아삭함을 살리고, 참기름·후추로 마무리하면 끝난다. 고추장 없이 간장과 고춧가루로 맛을 내 30분 이내에 완성되며, 목살로 바꿔도 된다.</p>
