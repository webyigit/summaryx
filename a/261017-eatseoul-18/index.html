<h1 style="font-size:20px">영등포 삼거리먼지막 순대국 — 가마솥에 끓이는 8천 원 순대국</h1>
<p>핫식신이 KBS &#x27;한국인의 밥상&#x27;에서 찾아낸 서울 노포 맛집 5곳으로 소개한 곳이다.</p><p>원문은 이곳을 서울에서 가장 오래된 순대국집이라고 소개하며, 문을 연 뒤로 줄곧 싼 가격을 지켜 왔다고 전한다. 뼈와 고기를 가마솥에 몇 시간씩 끓여 국물을 낸다.</p><p>여러 부위 내장을 담은 안주 접시도 인기다. 가격은 순대국 보통 8,000원, 술국 10,000원이고, 8시~19시 30분 영업, 화요일은 쉰다.</p>
