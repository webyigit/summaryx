<h1 style="font-size:20px">성북동 성암기사식당 — 유퀴즈에 나온 동태알곤이탕·코다리찜</h1>
<p>핫식신이 &#x27;고즈넉한 골목에서 즐기는 여유&#x27;를 주제로 고른 성북동 인기 맛집 5곳 가운데 하나다.</p><p>솜씨 좋은 주인이 운영하는 기사식당으로, 동태·코다리 요리에 반찬이 푸짐하게 나온다. TV 프로그램 &#x27;유퀴즈&#x27;에도 소개됐다고 한다.</p><p>가격은 동태알곤이탕 9,000원, 코다리찜 8,000원, 돼지불백 8,000원으로 1만 원이 넘지 않는다. 영업은 10시 30분~21시, 일요일은 휴무다.</p>
