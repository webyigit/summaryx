<h1 style="font-size:20px">장충동 뚱뚱이할머니집 — 장충동 족발골목의 족발 한 가지</h1>
<p>핫식신이 KBS &#x27;한국인의 밥상&#x27;에서 찾아낸 서울 노포 맛집 5곳으로 소개한 곳이다.</p><p>장충동 족발골목에서 인기 있는 집으로, 족발 한 가지만 판다. 껍질은 쫀득하고 살은 부드러우며 잡내가 없다는 평이다.</p><p>곁들임으로 새콤매콤한 쟁반막국수가 나온다. 가격은 족발(대) 50,000원이고, 수~월 10시~23시 영업, 화요일은 정기휴무다.</p>
