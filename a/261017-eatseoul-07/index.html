<h1 style="font-size:20px">잠실 청와옥 본점 — 맑고 깊은 국물, 줄 서는 순대국밥</h1>
<p>핫식신이 &#x27;진하고 시원한 국물로 입소문 난 서울 해장국 맛집 BEST 5&#x27;로 꼽은 곳이다.</p><p>뽀얗고 깔끔하면서 깊은 국물의 순대국밥 전문점이다. 정식과 모둠순대, 오징어구이도 있고, 붐비는 시간에는 대기 줄이 생길 만큼 손님이 많다고 한다.</p><p>테이블 간격이 넓고 매장이 깨끗해 가족 식사나 혼밥 모두 편하다는 평이다. 가격은 청와옥 순대국밥 11,000원, 얼큰 순대국밥 12,000원이며 매일 8시~22시 영업한다.</p>
