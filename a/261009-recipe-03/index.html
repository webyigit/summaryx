<h1 style="font-size:20px">백종원 대패삼겹살덮밥</h1>
<p>&#x27;집밥 백선생3&#x27;에 나온 대패삼겹살덮밥을 따라 만든 레시피다. 얇은 대패삼겹살을 볶아 나온 기름에 대파를 볶아 파기름을 내고, 설탕·간장·맛술로 달콤짭짤하게 간을 해 밥 위에 올린다.</p><p>재료는 고기·대파·기본 양념뿐이고 팬 하나로 끝난다. 대패삼겹살은 얇아서 금방 익고 기름이 알아서 나오기 때문에 따로 기름을 많이 쓸 필요가 없다. 설탕을 먼저 넣고 간장을 나중에 넣는 순서만 지키면 된다.</p>
