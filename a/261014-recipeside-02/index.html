<h1 style="font-size:20px">백종원 무나물볶음 — 들기름 파기름에 쌀뜨물로 부드럽게</h1>
<p>채 썬 무를 들기름으로 낸 파기름에 볶다가 쌀뜨물을 붓고 설탕·간장·다진마늘로 간하는 무나물 반찬이다. 작성자는 초간단하게 만들 수 있어 밥반찬은 물론 볶음밥에 넣어 먹어도 맛있다고 소개한다.</p><p>무 한 대접과 기본 양념으로 10분 이내에 2인분을 만든다. 쌀뜨물을 넣어 무를 부드럽게 익히고 마지막에 깨를 갈아 넣어 고소함을 더한다. 원문 재료 목록에는 깨가 빠져 있지만 조리 순서에서 사용한다.</p>
