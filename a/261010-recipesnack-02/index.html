<h1 style="font-size:20px">백종원 김치전 — 부침가루와 튀김가루 2:1로 바삭하게</h1>
<p>백종원 레시피로 부치는 바삭한 김치전이다. 부침가루와 튀김가루를 2대1로 섞어 반죽하는 것이 바삭함의 비결이고, 김치가 많이 시었으면 황설탕을, 덜 익었으면 식초를 조금 넣어 맛의 균형을 맞추라는 팁이 있다.</p><p>반죽은 기름을 넉넉히 두른 팬에 얇게 펴야 더 바삭하게 익는다. 신김치와 양파·파만 있으면 10분 안에 3인분을 부칠 수 있어 비 오는 날 간식이나 막걸리 안주로 잘 어울린다고 작성자는 소개한다.</p>
