<h1 style="font-size:20px">백종원 볶음라면 — 꼬들하게 삶아 대파와 스프 반만 볶기</h1>
<p>라면을 꼬들하게 삶아 물기를 뺀 뒤 식용유에 대파와 함께 볶는 백종원식 볶음라면이다. 작성자는 라면을 가끔 색다르게 먹고 싶을 때 &#x27;백주부&#x27; 볶음라면을 만들어 보라고 권한다.</p><p>라면 1봉, 대파 1줌, 식용유만 있으면 10분 이내에 완성된다. 끓일 때는 건더기 스프만 넣고, 볶을 때 분말 스프는 절반만 넣어야 짜지 않다.</p>
