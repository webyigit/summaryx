<h1 style="font-size:20px">건대입구 송림식당 — 300석 대형 돼지불백, 셀프 볶음밥</h1>
<p>서울시는 오랜 업력과 뛰어난 맛, 지역의 역사·문화를 간직한 가게를 &#x27;서울 오래가게&#x27;로 인증하는데, 핫식신이 이번에 새로 선정된 다섯 곳을 소개했다. 이곳은 그중 하나다.</p><p>300석이 넘는 대형 식당으로, 주차도 한 번에 50대까지 가능하다. 돼지불백을 불판에 볶아 먹고, 남은 양념에 직접 볶음밥을 만들어 먹는 것이 특징이다.</p><p>가격은 돼지불고기백반 12,000원이다. 평일 10시~22시, 주말 9시~22시 영업한다.</p>
