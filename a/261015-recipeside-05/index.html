<h1 style="font-size:20px">백종원 황태채볶음 — 간장은 팬 한쪽에 눌려 불맛</h1>
<p>불린 황태채를 파기름과 다진마늘에 볶고 고춧가루와 간장으로 맛을 내는 백종원식 황태채볶음이다. 작성자는 밥반찬으로도, 술안주로도 좋은 메뉴라고 소개한다.</p><p>황태채를 5분쯤 불려 가시를 고르고 볶기만 하면 돼 15분 안에 4인분이 된다. 간장은 팬 한쪽에 부어 끓어오르면 바로 섞어 불맛을 내는 것이 포인트이며, 오래 가열하면 쉽게 타니 짧게 해야 한다. 작성자는 대파 대신 시판 파기름을 썼다고 밝혔다.</p>
